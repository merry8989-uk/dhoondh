plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.dhoondh.app'
    compileSdk 34

    defaultConfig {
        applicationId "ai.dhoondh.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // To ship a signed release build, add a signingConfig here with your own
            // keystore (never commit a keystore or passwords to a public repo).
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies: plain WebView + framework Activity.
